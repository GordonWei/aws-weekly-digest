AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: AWS Weekly Digest — what AWS shipped this week, plus what your own account's usage says is worth fixing. Lambda + Bedrock + Cost Explorer, delivered via SES and archived to S3

# ── Deployment parameters ────────────────────────────────
Parameters:
  RecipientEmail:
    Type: String
    Description: Recipient email (must already be a verified SES identity)

  SenderEmail:
    Type: String
    Description: Sender email (must be SES-verified; can be the same as the recipient)

  BedrockModelId:
    Type: String
    Description: Bedrock model ID
    Default: us.amazon.nova-pro-v1:0
    AllowedValues:
      - us.amazon.nova-pro-v1:0
      - us.amazon.nova-lite-v1:0
      - us.anthropic.claude-3-5-sonnet-20241022-v2:0
      - us.anthropic.claude-3-haiku-20240307-v1:0

  BedrockRegion:
    Type: String
    Description: Region to call Bedrock in (must be one where Bedrock is available)
    Default: us-east-1

  # The account advice section runs on its own model — a different job from
  # writing the digest, and one that a cheaper model measurably does not do
  # well. See the ADVICE_MODEL_ID comment in lambda_function.py.
  AdviceModelId:
    Type: String
    Description: Bedrock model for the account advice section (must be an inference profile ID)
    Default: us.anthropic.claude-opus-5
    AllowedValues:
      - us.anthropic.claude-opus-5
      - us.anthropic.claude-sonnet-5
      - us.anthropic.claude-haiku-4-5-20251001-v1:0
      - us.amazon.nova-pro-v1:0

  # Claude Opus 5 runs adaptive thinking by default and comfortably exceeds
  # botocore's 60-second default. Keep this below the function Timeout so the
  # error notification still gets out.
  BedrockReadTimeout:
    Type: Number
    Description: Seconds to wait on a Bedrock response. Must stay below the function timeout.
    Default: 240
    MinValue: 30
    MaxValue: 800

  # ── LLM provider ─────────────────────────────────────────
  # Defaults to bedrock, which behaves exactly as it always has. Switch to
  # openai_compatible and LlmBaseUrl / LlmModel become required — one set of
  # settings then covers Gemini, LM Studio and a self-hosted LiteLLM alike.
  LlmProvider:
    Type: String
    Description: Which LLM backend to use (bedrock or openai_compatible)
    Default: bedrock
    AllowedValues: [bedrock, openai_compatible]

  LlmBaseUrl:
    Type: String
    Description: 'OpenAI-compatible endpoint including /v1. Only needed for openai_compatible.'
    Default: ''

  LlmModel:
    Type: String
    Description: 'Model name at the OpenAI-compatible endpoint. Only needed for openai_compatible.'
    Default: ''

  LlmApiKeyParam:
    Type: String
    Description: 'SSM parameter path holding the API key. Set it to an empty string to say the endpoint needs no auth (a local LM Studio, say).'
    Default: /aws-weekly-digest/llm-api-key

  # Keep this under the function Timeout in Globals (300), otherwise Lambda dies
  # before the HTTP call gives up and you lose the error notification with it.
  LlmTimeout:
    Type: Number
    Description: Seconds to wait on the LLM endpoint. Must stay below the function timeout.
    Default: 240
    MinValue: 30
    MaxValue: 290

  # Language the digest is written in. Each value has its own prompt in
  # lambda_function.py rather than a "reply in X" suffix, so adding one means
  # adding a builder there and a value here.
  DigestLanguage:
    Type: String
    Description: Language the digest is written in
    Default: en
    AllowedValues: [en, zh-TW]

  DaysLookback:
    Type: Number
    Description: How many days of What's New to look back over (7 works well)
    Default: 7

  # ── Feature flags ────────────────────────────────────────
  FeatureSendEmail:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  FeatureEmbedContent:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  FeatureSaveToS3:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  FeaturePostToLinkedIn:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  FeaturePostToWebhook:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  # Off by default: it costs Cost Explorer calls ($0.01 each) and a second model
  # invocation, and it needs ce:GetCostAndUsage. With it off the function behaves
  # exactly as it did before this existed.
  FeatureAccountAdvice:
    Type: String
    Description: Append a section advising on this account's own usage
    Default: 'false'
    AllowedValues: ['true', 'false']

# ── Globals ───────────────────────────────────────────────
Globals:
  Function:
    # 600, not the previous 300. The digest itself measured ~118s, and the
    # advice section adds a Claude Opus 5 call with adaptive thinking on top of
    # it. At 300 the two together sat close enough to the ceiling that a slow
    # week would have been cut off mid-run — and a Lambda killed by its own
    # timeout never reaches the except block that sends the failure email, so
    # the symptom would have been silence.
    Runtime: python3.12
    Timeout: 600
    MemorySize: 256
    Architectures: [arm64]

# ── Resources ────────────────────────────────────────────
Resources:

  # S3 bucket holding the archived digests
  DigestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'aws-weekly-digest-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldDigests
            Status: Enabled
            ExpirationInDays: 365
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lambda execution role
  DigestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'aws-weekly-digest-role-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DigestPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Bedrock — invoking the model.
              # Watch out: when BedrockModelId is a Cross-Region Inference Profile ID
              # (us.amazon.nova-pro-v1:0 and friends), IAM checks two resources on every
              # call — the inference-profile itself, and the underlying foundation-model
              # it routes to, which does NOT carry the us. prefix. Substituting the
              # profile ID straight into a foundation-model ARN gets you a denial.
              # Those underlying models also live in more than one destination region:
              # GetInferenceProfile reports us-east-1 / us-east-2 / us-west-2 for the
              # us. Nova and Claude profiles. Granting only the region you assumed leaves
              # an intermittent failure waiting to happen, so the region segment is a
              # wildcard here and the model IDs stay explicit (they match AllowedValues).
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0'
                  - 'arn:aws:bedrock:*::foundation-model/amazon.nova-lite-v1:0'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'
                  # Underlying models for the AdviceModelId profiles. Same rule
                  # as the note above: the foundation-model ARN carries no us. prefix.
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-opus-5'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-5'
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
                  - !Sub 'arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/*'
              # Cost Explorer — reading this account's own usage for the advice
              # section. Cost Explorer has no resource-level permissions, so '*'
              # is the only thing that can be written here; the actions are
              # read-only. ce:GetCostAndUsage is billed at $0.01 per call.
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                Resource: '*'
              # SES — sending mail, restricted to the configured sender address
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SenderEmail
              # S3 — writing the archive copy
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${DigestBucket.Arn}/digests/*'
              # SSM Parameter Store — LinkedIn token / webhook URL / LLM API key.
              # The prefix wildcard already covers the default LlmApiKeyParam path, so
              # adding another parameter under it needs no change here.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/aws-weekly-digest/*'

  # Lambda function
  DigestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: aws-weekly-digest
      Description: 'AWS Weekly Digest — collects What''s New, analyses it with Bedrock, fans the result out'
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Role: !GetAtt DigestFunctionRole.Arn
      Environment:
        Variables:
          BEDROCK_MODEL_ID:     !Ref BedrockModelId
          BEDROCK_REGION:       !Ref BedrockRegion
          ADVICE_MODEL_ID:      !Ref AdviceModelId
          BEDROCK_READ_TIMEOUT: !Ref BedrockReadTimeout
          LLM_PROVIDER:         !Ref LlmProvider
          LLM_BASE_URL:         !Ref LlmBaseUrl
          LLM_MODEL:            !Ref LlmModel
          LLM_API_KEY_PARAM:    !Ref LlmApiKeyParam
          LLM_TIMEOUT:          !Ref LlmTimeout
          DIGEST_LANGUAGE:      !Ref DigestLanguage
          RECIPIENT_EMAIL:      !Ref RecipientEmail
          SENDER_EMAIL:         !Ref SenderEmail
          S3_BUCKET:            !Ref DigestBucket
          DAYS_LOOKBACK:        !Ref DaysLookback
          MAX_WHATS_NEW:        '80'
          FEATURE_SEND_EMAIL:      !Ref FeatureSendEmail
          FEATURE_EMBED_CONTENT:   !Ref FeatureEmbedContent
          FEATURE_SAVE_TO_S3:      !Ref FeatureSaveToS3
          FEATURE_POST_TO_LINKEDIN: !Ref FeaturePostToLinkedIn
          FEATURE_POST_TO_WEBHOOK:  !Ref FeaturePostToWebhook
          FEATURE_ACCOUNT_ADVICE:   !Ref FeatureAccountAdvice
      # No function URL — the real trigger is the EventBridge Scheduler below.
      # For a manual run, invoke the function directly.

  # Role the EventBridge Scheduler assumes to invoke the function
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'aws-weekly-digest-scheduler-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DigestFunction.Arn

  # EventBridge Scheduler — Fridays at 17:00 Asia/Taipei (= 09:00 UTC)
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: aws-weekly-digest-friday
      Description: 'Generates the AWS Weekly Digest every Friday at 17:00 Asia/Taipei'
      ScheduleExpression: 'cron(0 9 ? * FRI *)'
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'FLEXIBLE'
        MaximumWindowInMinutes: 10
      Target:
        Arn: !GetAtt DigestFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
      State: ENABLED

# ── Outputs ──────────────────────────────────────────────
Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !Ref DigestFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DigestFunction.Arn

  DigestBucketName:
    Description: Name of the S3 bucket holding the archives
    Value: !Ref DigestBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  SchedulerName:
    Description: EventBridge Scheduler name
    Value: !Ref WeeklySchedule
